<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Access Terminal | MECHARM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="theme-toggle.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('maat-theme') === 'light' ? 'theme-light' : 'theme-dark';
          document.documentElement.classList.add(mode);
        } catch (error) {
          document.documentElement.classList.add('theme-dark');
        }
      })();
    </script>
    <script src="theme-toggle.js" defer></script>
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background: linear-gradient(135deg, #020617 0%, #0a0a0f 50%, #042f2e 100%);
      }
      .font-mono { font-family: 'JetBrains Mono', monospace; }
      .glass {
        background: rgba(9, 9, 16, 0.88);
        backdrop-filter: blur(16px);
        border: 1px solid rgba(30, 30, 46, 0.9);
      }
      .password-wrap {
        position: relative;
      }
      .password-toggle {
        position: absolute;
        right: 0.75rem;
        top: 50%;
        transform: translateY(-50%);
        z-index: 2;
        cursor: pointer;
        border: 1px solid rgba(100, 116, 139, 0.45);
        background: rgba(15, 23, 42, 0.75);
        color: #94a3b8;
        padding: 0.2rem 0.55rem;
        border-radius: 0.45rem;
        font-size: 0.65rem;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        transition: color 0.2s ease, border-color 0.2s ease;
      }
      .password-toggle:hover {
        color: #67e8f9;
        border-color: rgba(34, 211, 238, 0.65);
      }
      html.theme-light .password-toggle {
        background: rgba(248, 250, 252, 0.95);
        color: #0f172a;
        border-color: rgba(100, 116, 139, 0.45);
      }
    </style>
  </head>
  <body class="min-h-screen">
    <main class="flex min-h-screen items-center justify-center px-4 py-10">
      <div class="w-full max-w-md rounded-2xl border border-cyan-800/40 bg-cyan-950/20 p-2 shadow-2xl shadow-cyan-950/40">
        <div class="glass rounded-2xl p-8">
          <div class="mb-8 text-center">
            <div class="mx-auto mb-4 flex h-12 w-12 items-center justify-center rounded-full border border-cyan-700/40 bg-cyan-900/50 text-cyan-300">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
              </svg>
            </div>
            <h1 class="font-mono text-lg uppercase tracking-[0.25em] text-white">Authentication required</h1>
            <p class="mt-2 text-sm text-slate-400">Enter your admin credentials to continue.</p>
          </div>

          <form id="admin-login-form" class="space-y-5" novalidate>
            <div>
              <label class="mb-2 block font-mono text-xs uppercase tracking-[0.25em] text-cyan-400">Admin ID</label>
              <input id="admin-id" type="text" placeholder="ADM-7701-X" class="w-full rounded-lg border border-slate-800 bg-slate-950/70 px-4 py-3 text-sm text-white outline-none ring-0 placeholder:text-slate-500 focus:border-cyan-500" />
            </div>
            <div>
              <label class="mb-2 block font-mono text-xs uppercase tracking-[0.25em] text-cyan-400">Passkey</label>
              <div class="password-wrap">
                <input id="admin-passkey" type="password" placeholder="Enter passkey" class="w-full rounded-lg border border-slate-800 bg-slate-950/70 px-4 py-3 pr-20 text-sm text-white outline-none ring-0 placeholder:text-slate-500 focus:border-cyan-500" />
                <button id="toggle-passkey" type="button" class="password-toggle font-mono" aria-controls="admin-passkey" aria-label="Show password" aria-pressed="false">Show</button>
              </div>
            </div>
            <p id="login-feedback" class="hidden rounded-lg border px-3 py-2 text-xs font-medium" aria-live="polite"></p>
            <button id="login-submit" type="submit" class="w-full rounded-lg bg-cyan-600 px-4 py-3 text-sm font-semibold text-white transition hover:bg-cyan-500">Execute login</button>
          </form>

          <div class="mt-6 flex items-center justify-between border-t border-slate-800 pt-4 text-xs text-slate-500">
            <span>Secure connection</span>
            <span class="text-cyan-400">TLS 1.3</span>
          </div>

          <div class="mt-6 text-center">
            <a href="mech-lamp-storefront.html" class="text-sm text-slate-400 transition hover:text-cyan-300">Return to main frame</a>
          </div>
        </div>
      </div>
    </main>
    <script>
      (function () {
        var form = document.getElementById('admin-login-form');
        var adminIdInput = document.getElementById('admin-id');
        var passwordInput = document.getElementById('admin-passkey');
        var toggleButton = document.getElementById('toggle-passkey');
        var submitButton = document.getElementById('login-submit');
        var feedback = document.getElementById('login-feedback');
        var expectedAdminId = 'ADM-0001-Z';
        var expectedPassword = 'ChangeMe!2026';

        if (!form || !adminIdInput || !passwordInput || !toggleButton || !submitButton || !feedback) {
          return;
        }

        function showFeedback(message, status) {
          feedback.textContent = message;
          feedback.classList.remove('hidden', 'border-red-500/70', 'bg-red-950/40', 'text-red-300', 'border-emerald-500/70', 'bg-emerald-950/40', 'text-emerald-200');

          if (status === 'error') {
            feedback.classList.add('border-red-500/70', 'bg-red-950/40', 'text-red-300');
            return;
          }

          feedback.classList.add('border-emerald-500/70', 'bg-emerald-950/40', 'text-emerald-200');
        }

        function syncToggleUI(isVisible) {
          toggleButton.textContent = isVisible ? 'Hide' : 'Show';
          toggleButton.setAttribute('aria-pressed', String(isVisible));
          toggleButton.setAttribute('aria-label', isVisible ? 'Hide password' : 'Show password');
        }

        // Always start hidden on page load for predictable behavior.
        passwordInput.type = 'password';
        syncToggleUI(false);

        toggleButton.addEventListener('click', function () {
          var nextVisible = passwordInput.type === 'password';
          passwordInput.type = nextVisible ? 'text' : 'password';
          syncToggleUI(nextVisible);
        });

        form.addEventListener('submit', function (event) {
          event.preventDefault();

          passwordInput.classList.remove('border-red-500', 'focus:border-red-400');
          passwordInput.classList.add('focus:border-cyan-500');
          adminIdInput.classList.remove('border-red-500', 'focus:border-red-400');
          adminIdInput.classList.add('focus:border-cyan-500');

          var enteredAdminId = adminIdInput.value.trim();
          var isValid = enteredAdminId === expectedAdminId && passwordInput.value === expectedPassword;

          if (!isValid) {
            adminIdInput.classList.add('border-red-500', 'focus:border-red-400');
            adminIdInput.classList.remove('focus:border-cyan-500');
            passwordInput.classList.add('border-red-500', 'focus:border-red-400');
            passwordInput.classList.remove('focus:border-cyan-500');
            showFeedback('Invalid admin ID or password. Please try again.', 'error');
            return;
          }

          submitButton.disabled = true;
          submitButton.textContent = 'Verifying...';
          submitButton.classList.add('opacity-70', 'cursor-not-allowed');
          showFeedback('Access granted. Redirecting to control panel...', 'success');

          window.setTimeout(function () {
            window.location.href = 'lead-admin-panel.html';
          }, 700);
        });
      })();
    </script>
  </body>
</html>
