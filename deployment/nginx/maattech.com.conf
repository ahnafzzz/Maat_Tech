# Production Nginx config for Laravel app
# Path assumption: /var/www/maat-tech/laravel-app
# Replace maattech.com with your real domain.
# Replace PHP-FPM socket if your server uses a different version/path.

server {
    listen 80;
    listen [::]:80;
    server_name maattech.com www.maattech.com;

    # Let Let's Encrypt challenges pass over HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://maattech.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name maattech.com www.maattech.com;

    root /var/www/maat-tech/laravel-app/public;
    index index.php index.html;

    # TLS (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/maattech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/maattech.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/maattech.com/chain.pem;

    # Modern TLS settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Reasonable upload limit for product/media uploads
    client_max_body_size 20M;

    # Logs
    access_log /var/log/nginx/maattech.access.log;
    error_log /var/log/nginx/maattech.error.log warn;

    # Main app routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Static assets cache
    location ~* \.(?:css|js|jpg|jpeg|gif|png|svg|ico|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        access_log off;
    }

    # Deny hidden files except ACME challenge directory
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # PHP handling
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }
}
