name: Laravel Auto Deploy

on:
  push:
    branches: ["main"]
    paths:
      - "laravel-app/**"
      - ".github/workflows/laravel-auto-deploy.yml"
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  test-and-build:
    name: Test and Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: laravel-app

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, bcmath, pdo_sqlite, sqlite3, intl, curl, xml, zip
          tools: composer:2.10
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: laravel-app/package-lock.json

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Install NPM dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Prepare test environment
        run: |
          cp .env.example .env
          touch database/database.sqlite
          php artisan key:generate

      - name: Run tests
        run: php artisan test --without-tty

  deploy:
    name: Deploy to Production
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, bcmath, pdo_sqlite, sqlite3, intl, curl, xml, zip
          tools: composer:2.10
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: laravel-app/package-lock.json

      - name: Prepare production artifact before remote changes
        working-directory: laravel-app
        run: |
          composer install --no-dev --no-interaction --prefer-dist --classmap-authoritative --optimize-autoloader
          composer check-platform-reqs --no-dev
          npm ci
          npm run build
          test -f public/build/manifest.json

      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}

      - name: Configure trusted SSH host identity
        env:
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_KNOWN_HOSTS"
          install -m 0700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/known_hosts

      - name: Upload prepared release to isolated incoming directory
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          for value in "$DEPLOY_HOST" "$DEPLOY_PORT" "$DEPLOY_USER" "$DEPLOY_PATH"; do
            test -n "$value"
          done
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]]
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]
          incoming="${DEPLOY_PATH}.incoming-${GITHUB_SHA}"
          remote="${DEPLOY_USER}@${DEPLOY_HOST}"
          ssh -o StrictHostKeyChecking=yes -p "$DEPLOY_PORT" "$remote" "test -d '$DEPLOY_PATH/laravel-app' && mkdir -p '$incoming'"
          rsync -az --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'node_modules' \
            -e "ssh -o StrictHostKeyChecking=yes -p $DEPLOY_PORT" \
            ./ "$remote:$incoming/"

      - name: Deploy with lock, backup, migration, and health gate
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_BACKUP_PATH: ${{ secrets.DEPLOY_BACKUP_PATH }}
          DEPLOY_HEALTHCHECK_URL: ${{ secrets.DEPLOY_HEALTHCHECK_URL }}
          DEPLOY_QUIESCE_HOOK: ${{ secrets.DEPLOY_QUIESCE_HOOK }}
          DEPLOY_RESUME_HOOK: ${{ secrets.DEPLOY_RESUME_HOOK }}
        run: |
          set -euo pipefail
          for value in "$DEPLOY_HOST" "$DEPLOY_PORT" "$DEPLOY_USER" "$DEPLOY_PATH" "$DEPLOY_BACKUP_PATH" "$DEPLOY_HEALTHCHECK_URL" "$DEPLOY_QUIESCE_HOOK" "$DEPLOY_RESUME_HOOK"; do
            test -n "$value"
          done
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]]
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "$DEPLOY_BACKUP_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "$DEPLOY_QUIESCE_HOOK" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "$DEPLOY_RESUME_HOOK" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "$DEPLOY_HEALTHCHECK_URL" =~ ^https?://[^[:space:]]+$ ]]
          incoming="${DEPLOY_PATH}.incoming-${GITHUB_SHA}"
          remote="${DEPLOY_USER}@${DEPLOY_HOST}"
          ssh -o StrictHostKeyChecking=yes -p "$DEPLOY_PORT" "$remote" \
            "bash '$incoming/deployment/deploy-laravel.sh' '$incoming' '$DEPLOY_PATH' '$DEPLOY_BACKUP_PATH' '$DEPLOY_HEALTHCHECK_URL' '$DEPLOY_QUIESCE_HOOK' '$DEPLOY_RESUME_HOOK' '$GITHUB_SHA'"
          ssh -o StrictHostKeyChecking=yes -p "$DEPLOY_PORT" "$remote" "rm -rf -- '$incoming'"
