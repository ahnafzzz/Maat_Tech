# Replace filesystem and PHP-FPM socket placeholders only after the host is known.
server {
    listen 80;
    listen [::]:80;
    server_name maattechbd.store www.maattechbd.store;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://www.maattechbd.store$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name maattechbd.store;

    ssl_certificate /etc/letsencrypt/live/www.maattechbd.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.maattechbd.store/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    return 301 https://www.maattechbd.store$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.maattechbd.store;

    root /var/www/maat-tech/laravel-app/public;
    index index.php;

    ssl_certificate /etc/letsencrypt/live/www.maattechbd.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.maattechbd.store/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    client_max_body_size 25M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ^~ /storage/ {
        try_files $uri =404;
        location ~ \.php$ { return 404; }
        add_header X-Content-Type-Options nosniff always;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\. { deny all; }
    location ~* /(?:\.env|composer\.(?:json|lock)|package(?:-lock)?\.json|artisan)$ { deny all; }
}
