<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Desk lamp poster renderer</title>
    <style>
        html, body, canvas { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #090d13; }
        canvas { display: block; }
    </style>
</head>
<body>
    <canvas id="poster" aria-label="Desk lamp poster render"></canvas>
    <script type="module">
        import { DeskLampShowcaseRenderer } from '/resources/js/desk-lamp-renderer.js';

        const canvas = document.querySelector('#poster');
        try {
            const renderer = await DeskLampShowcaseRenderer.create(
                canvas,
                '/public/assets/models/desk-lamp/desk-lamp.de824f25cf33f9e6.json',
                {
                    onFirstFrame() {
                        document.documentElement.dataset.posterReady = 'true';
                    },
                    onError(error) {
                        document.documentElement.dataset.posterError = error.message;
                    },
                },
            );
            renderer.setReducedMotion(true);
            renderer.setActive(false);
            renderer.requestDraw();
            window.posterRenderer = renderer;
        } catch (error) {
            document.documentElement.dataset.posterError = error.message;
        }
    </script>
</body>
</html>
